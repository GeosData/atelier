<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atelier — herramientas</title>
<style>
  :root { --ink:#1c1a17; --pino:#2f5d50; --paper:#f4f1ea; --line:#d8d2c4; --muted:#6b6355; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.55 ui-monospace,"SFMono-Regular",Menlo,monospace; color:var(--ink); background:var(--paper); }
  main { max-width:760px; margin:0 auto; padding:56px 20px; }
  h1 { font-size:1.7rem; margin:0 0 6px; }
  p.sub { margin:0 0 36px; color:var(--muted); }
  .grid { display:grid; gap:14px; }
  a.card { display:block; text-decoration:none; color:inherit; border:1px solid var(--line); border-radius:12px; padding:18px 20px; background:#fff; transition:border-color .15s, transform .15s; }
  a.card:hover { border-color:var(--pino); transform:translateY(-2px); }
  a.card h2 { margin:0 0 4px; font-size:1.05rem; color:var(--pino); }
  a.card p { margin:0; color:var(--muted); font-size:.92rem; }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Atelier</h1>
  <p class="sub">Herramientas que resuelven una cosa concreta. Subís un archivo, obtenés el resultado.</p>
  <div class="grid" id="grid"><p class="empty">Cargando…</p></div>
</main>
<script>
  const API = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
    ? "http://localhost:8080" : "https://api.atelier.geosdata.com";
  fetch(`${API}/products`).then(r => r.json()).then(list => {
    const grid = document.getElementById("grid");
    if (!list.length) { grid.innerHTML = '<p class="empty">Sin herramientas todavía.</p>'; return; }
    grid.innerHTML = list.map(p => `
      <a class="card" href="product.html?p=${encodeURIComponent(p.slug)}">
        <h2>${p.title}</h2>
        <p>${p.subtitle || ""}</p>
      </a>`).join("");
  }).catch(() => {
    document.getElementById("grid").innerHTML = '<p class="empty">No se pudo cargar el catálogo.</p>';
  });
</script>
</body>
</html>
